# Windows build — VST3 + Standalone.
#
# Toolchain: Ninja + clang-cl inside an MSVC dev environment (msvc-dev-cmd
# picks whatever VS the runner image ships, so this survives image upgrades).
# clang-cl is required (not plain MSVC cl): the C core uses C11 <stdatomic.h>
# and __builtin_prefetch. See vst/source/compat/win32/ for the POSIX→Win32
# layer.
#
# TTS (sherpa-onnx) and the VIDEO file source are macOS-only for now and are
# compiled out automatically (PiperTts stub + VideoFileReaderStub).
name: Windows build

on:
  push:
    branches: [master, feature/windows-port]
    paths-ignore:
      - '**.md'
      - 'prebuilt/**'
  workflow_dispatch:

permissions:
  contents: write   # publish step: update the beta release assets

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      # JUCE is fetched by CMake FetchContent into build/_deps (~2 min clone);
      # cache it keyed on the pinned tag in vst/CMakeLists.txt.
      - name: Cache JUCE (FetchContent)
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-deps-${{ runner.os }}-${{ hashFiles('vst/CMakeLists.txt') }}

      - name: MSVC dev environment (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: >
          cmake -B build -S vst -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang-cl
          -DCMAKE_CXX_COMPILER=clang-cl

      - name: Build (VST3 + Standalone)
        run: >
          cmake --build build
          --target Sp3ctraVST_VST3 Sp3ctraVST_Standalone
          --parallel

      # Prove the static-CRT switch worked: a clean Windows must not need the
      # VC++ redistributable, so no module may import VCRUNTIME140*/MSVCP140.
      - name: Verify self-contained (no dynamic VC++ runtime)
        shell: pwsh
        run: |
          $exe = "build/Sp3ctraVST_artefacts/Release/Standalone/Sp3ctra.exe"
          $vst3 = Get-ChildItem -Recurse -Filter "Sp3ctra.vst3" `
                    "build/Sp3ctraVST_artefacts/Release/VST3" |
                    Where-Object { -not $_.PSIsContainer } | Select-Object -First 1
          $fail = $false
          foreach ($bin in @($exe, $vst3.FullName)) {
            $deps = & dumpbin /dependents $bin 2>$null
            $bad = $deps | Select-String -Pattern 'VCRUNTIME140|MSVCP140|CONCRT140'
            if ($bad) {
              Write-Host "❌ $bin still imports the dynamic VC++ runtime:`n$bad"
              $fail = $true
            } else {
              Write-Host "✅ $bin is self-contained (static CRT)"
            }
          }
          if ($fail) { exit 1 }

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Sp3ctra-VST3-Windows-x64
          path: build/Sp3ctraVST_artefacts/Release/VST3/
          if-no-files-found: error

      - name: Upload Standalone
        uses: actions/upload-artifact@v4
        with:
          name: Sp3ctra-Standalone-Windows-x64
          path: build/Sp3ctraVST_artefacts/Release/Standalone/
          if-no-files-found: error

      # PDB symbols of THIS exact build — required to symbolicate crash dumps
      # (Event Viewer offsets / LocalDumps .dmp) from the field.
      - name: Upload PDB symbols
        uses: actions/upload-artifact@v4
        with:
          name: Sp3ctra-PDB-Windows-x64
          path: |
            build/Sp3ctraVST_artefacts/**/*.pdb
            build/CMakeFiles/**/*.pdb
          if-no-files-found: error

      # Every green master build refreshes the public beta download. The tag
      # and asset names derive from vst/VERSION (major.minor): bumping VERSION
      # to X.Y.0 auto-creates release vX.Y.0-beta.1 on the next green build —
      # no workflow edit needed. URLs stay constant within a X.Y cycle; the
      # ondulab.com download page only changes when X.Y changes. LICENSE +
      # THIRD-PARTY-NOTICES ride inside each zip (GPLv3 checklist).
      # latest-windows.json carries the FULL x.y.z (tag/assets only carry x.y):
      # the in-app updater (AppUpdater) reads it to detect new builds. Uploaded
      # last so the manifest never advertises a version whose zip isn't up yet.
      - name: Publish to release (master → beta channel)
        if: github.ref == 'refs/heads/master'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = (Get-Content vst/VERSION -Raw).Trim()
          $mm  = ($ver -split '\.')[0..1] -join '.'
          $tag = "v$mm.0-beta.1"
          $base = "Sp3ctra-$mm.0-beta"
          gh release view $tag -R "${{ github.repository }}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --prerelease --title "Sp3ctra $mm bêta" `
              --notes "Builds automatiques de master (canal bêta $mm). Installation et notes : voir la page de téléchargement ondulab.com." `
              -R "${{ github.repository }}"
          }
          $sdir = "$base-Windows-Standalone-x64"
          New-Item -ItemType Directory -Force $sdir | Out-Null
          Copy-Item build/Sp3ctraVST_artefacts/Release/Standalone/Sp3ctra.exe $sdir/
          Copy-Item -Recurse build/Sp3ctraVST_artefacts/Release/Standalone/Resources $sdir/Resources
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.md $sdir/
          Compress-Archive -Path $sdir -DestinationPath "$sdir.zip" -Force
          $vdir = "$base-Windows-VST3-x64"
          New-Item -ItemType Directory -Force $vdir | Out-Null
          Copy-Item -Recurse build/Sp3ctraVST_artefacts/Release/VST3/Sp3ctra.vst3 $vdir/Sp3ctra.vst3
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.md $vdir/
          Compress-Archive -Path $vdir -DestinationPath "$vdir.zip" -Force
          # Setup exe (Inno Setup, preinstalled on the runner): Standalone +
          # VST3 checkboxes. Zips stay: AppUpdater downloads the Standalone zip.
          $setup = "$base-Windows-Setup-x64"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$ver" `
            "/DArtefactsDir=$PWD\build\Sp3ctraVST_artefacts\Release" `
            "/DRepoDir=$PWD" "/DOutDir=$PWD" "/DOutName=$setup" `
            scripts\package\windows-installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # No -NoNewline: the switch is a filesystem-provider dynamic param
          # missing on the runner's pwsh, and a trailing newline parses fine.
          Set-Content latest-windows.json "{`"version`":`"$ver`",`"standalone`":`"$sdir.zip`"}"
          gh release upload $tag "$sdir.zip" "$vdir.zip" "$setup.exe" --clobber -R "${{ github.repository }}"
          gh release upload $tag latest-windows.json --clobber -R "${{ github.repository }}"
