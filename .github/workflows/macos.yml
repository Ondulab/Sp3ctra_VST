# macOS build — VST3 + AU + Standalone (arm64).
#
# Compilation CI only: binaries are NOT codesigned/notarized (Gatekeeper will
# warn on machines other than the build host) — signing is a separate release
# concern. Voices are embedded in each bundle (~160 MB per format).
name: macOS build

on:
  push:
    branches: [master, feature/windows-port]
    paths-ignore:
      - '**.md'
      - 'prebuilt/**'
  workflow_dispatch:

permissions:
  contents: write   # publish step: update the beta release assets

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Cache deps (JUCE, sherpa-onnx, voices)
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('vst/CMakeLists.txt') }}

      - name: Configure
        run: cmake -B build -S vst -DCMAKE_BUILD_TYPE=Release

      - name: Build (VST3 + AU + Standalone)
        run: >
          cmake --build build
          --target Sp3ctraVST_VST3 Sp3ctraVST_AU Sp3ctraVST_Standalone
          --parallel 3

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Sp3ctra-VST3-macOS-arm64
          path: build/Sp3ctraVST_artefacts/Release/VST3/
          if-no-files-found: error

      - name: Upload AU
        uses: actions/upload-artifact@v4
        with:
          name: Sp3ctra-AU-macOS-arm64
          path: build/Sp3ctraVST_artefacts/Release/AU/
          if-no-files-found: error

      - name: Upload Standalone
        uses: actions/upload-artifact@v4
        with:
          name: Sp3ctra-Standalone-macOS-arm64
          path: build/Sp3ctraVST_artefacts/Release/Standalone/
          if-no-files-found: error

      # Every green master build refreshes the public beta download. Tag and
      # asset names derive from vst/VERSION (major.minor) — bumping VERSION to
      # X.Y.0 auto-creates release vX.Y.0-beta.1 on the next green build.
      # ditto preserves bundle exec permissions (upload-artifact does not).
      # LICENSE + THIRD-PARTY-NOTICES ride inside each zip (GPLv3 checklist).
      # A .pkg installer (Standalone/VST3/AU checkboxes) rides alongside the
      # zips — the zips stay: AppUpdater downloads the Standalone zip.
      # latest-macos.json carries the FULL x.y.z (tag/assets only carry x.y):
      # the in-app updater (AppUpdater) reads it to detect new builds. Uploaded
      # last so the manifest never advertises a version whose zip isn't up yet.
      - name: Publish to release (master → beta channel)
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(tr -d ' \n' < vst/VERSION)
          mm=${ver%.*}
          tag="v${mm}.0-beta.1"
          base="Sp3ctra-${mm}.0-beta"
          gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$tag" --prerelease --title "Sp3ctra $mm bêta" \
              --notes "Builds automatiques de master (canal bêta $mm). Installation et notes : voir la page de téléchargement ondulab.com." \
              -R "$GITHUB_REPOSITORY"
          for fmt in Standalone VST3 AU; do
            case $fmt in Standalone) b=Sp3ctra.app;; VST3) b=Sp3ctra.vst3;; AU) b=Sp3ctra.component;; esac
            dir="${base}-macOS-$fmt-arm64"
            rm -rf "$dir"; mkdir "$dir"
            cp -R "build/Sp3ctraVST_artefacts/Release/$fmt/$b" "$dir/"
            cp LICENSE THIRD-PARTY-NOTICES.md "$dir/"
            ditto -c -k --keepParent "$dir" "$dir.zip"
          done
          scripts/package/make-macos-pkg.sh build/Sp3ctraVST_artefacts/Release \
            "$ver" "${base}-macOS-Installer-arm64.pkg"
          printf '{"version":"%s","standalone":"%s-macOS-Standalone-arm64.zip"}\n' \
            "$ver" "$base" > latest-macos.json
          gh release upload "$tag" ${base}-macOS-*.zip "${base}-macOS-Installer-arm64.pkg" \
            --clobber -R "$GITHUB_REPOSITORY"
          gh release upload "$tag" latest-macos.json --clobber -R "$GITHUB_REPOSITORY"
